name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and package / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: aarch64
            tasks: packageDmg
            artifact: YonakaReader-macOS-arm64-dmg
            packages: build/macos/dmg/*.dmg
          - os: windows-2022
            platform: windows
            arch: x64
            tasks: packageMsi packageWindowsZip
            artifact: YonakaReader-windows-x64
            packages: |
              build/desktop-packages/windows/msi/*.msi
              build/desktop-packages/windows/portable/*
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            tasks: packageDeb packageLinuxTar
            artifact: YonakaReader-linux-x64
            packages: |
              build/desktop-packages/linux/deb/*.deb
              build/desktop-packages/linux/portable/*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: ${{ matrix.arch }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Read release version
        id: version
        shell: bash
        run: echo "version=$(bash ./gradlew --quiet printVersion)" >> "$GITHUB_OUTPUT"
      - name: Test release automation
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Install DEB packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot xdg-utils
          # Hosted runners lack the standard Desktop menu directory used by xdg-desktop-menu.
          sudo mkdir -p /usr/share/desktop-directories
      - name: Locate WiX 3 tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Join-Path $env:WIX 'bin'
          if (!(Test-Path (Join-Path $wixBin 'candle.exe')) -or !(Test-Path (Join-Path $wixBin 'light.exe'))) {
            throw 'WiX 3 candle.exe and light.exe are required by JDK 25 jpackage.'
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test, verify SQLite and build packages
        shell: bash
        run: bash ./gradlew --no-daemon clean test fatJar packagedStoreSmoke ${{ matrix.tasks }}
      - name: Verify extracted installer runtime
        if: runner.os != 'macOS'
        shell: bash
        run: python packaging/tools/verify_installer.py ${{ matrix.platform }}
      - name: Verify installation and uninstallation
        if: runner.os != 'macOS'
        shell: bash
        run: python packaging/tools/verify_uninstall.py ${{ matrix.platform }}
      - name: Upload native packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload runnable JAR
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yonaka-reader-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/desktop-packages/${{ matrix.platform }}/msi-*.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.verify.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: YonakaReader-*
          path: release-input
          merge-multiple: true
      - name: Download runnable JAR
        uses: actions/download-artifact@v4
        with:
          name: yonaka-reader-jar
          path: release-input
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: >-
          python3 packaging/tools/publish_release.py
          --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA"
          --version "$RELEASE_VERSION"
          --artifacts release-input
          --output release-assets
